[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kobi-music-toolkit"
version = "0.1.0"
description = "Local music transcription, score conversion and playback"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.18", "mido>=1.3", "numpy>=1.26", "soundfile>=0.12", "tinysoundfont==0.3.7", "pymupdf>=1.25", "pillow>=11", "verovio>=5"]

[project.scripts]
kobi-music = "kobi_music.cli:main"

[tool.setuptools.packages.find]
include = ["kobi_music*"]

[tool.setuptools.package-data]
kobi_music = ["static/*"]
